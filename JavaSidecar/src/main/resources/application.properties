server.port=8080

# List of models to register at startup.
# Add more entries (cql.models[1]..., cql.models[2]...) for additional models.
# uri must exactly match the 'url' attribute in the ModelInfo XML and the 'using' URI in ELM.
cql.models[0].uri=urn:piqi_patient-model:1.0.0
cql.models[0].info-path=model/piqi_patient-modelinfo.xml

# FHIR R4 terminology server for value set expansion.
# Leave blank to skip value set resolution (CQL expressions using 'in valueset' will return empty).
cql.terminology.fhir-base-url=
# Set to true if the FHIR server uses a self-signed or untrusted TLS certificate.
cql.terminology.skip-ssl-verify=true
# High-capacity weighted caches for value-set expansion and membership lookup.
cql.terminology.valueset-cache-max-weight=500000
cql.terminology.membership-cache-max-weight=1000000
cql.terminology.valueset-cache-ttl-minutes=30
cql.terminology.validate-cache-max-size=200000
cql.terminology.validate-cache-ttl-minutes=20
